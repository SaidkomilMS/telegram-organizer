# --- the menu: three choices, one line each on cost and privacy ---
llm_menu = """<b>Language model</b> — now: {current}

<b>None</b> — free. Nothing leaves the server: digest lines are the first line of each post.
<b>Self-hosted</b> — free per request (you run the server). Post text goes only to your own server.
<b>Provider</b> — a few cents a month (about $0.03–$0.62 for ~450 digest lines). The text of posts picked for a digest is sent to the provider you pick."""
