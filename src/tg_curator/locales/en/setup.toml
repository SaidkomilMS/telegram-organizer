setup_help_setup = "the setup walkthrough, continued from where it stopped"

setup_welcome = "Hello! I am your curator bot. Setup is at step {number} of {total}: send /setup to continue, or /help for every command."
setup_welcome_done = "Hello! Everything is set up. /status shows how it runs, /help lists every command."

