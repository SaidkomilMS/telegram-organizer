# /settings — the tunable keys from the bot (DESIGN §11.2 settings.py). HTML is allowed;
# {placeholders} are filled with str.format. Names and titles are HTML-escaped by
# bot/settings.py before they reach these strings.

settings_help_settings = "digest time and length, posting style, strictness, review day, trusted sources"

# --- the menu ---
settings_menu = """<b>Settings</b>
{lines}

Tap what to change. Sorting changes can be previewed on the last days of real posts first."""
settings_menu_line = "{label}: <b>{value}</b>"
settings_pick_button = "Tap one of the buttons above."

# --- labels and what moving each key does ---
settings_label_timezone = "Timezone"
settings_hint_timezone = "Your timezone, as an IANA name such as Asia/Tashkent or Europe/Berlin; the digest and review hours are local to it."
settings_label_digest_hour = "Digest hour"
settings_hint_digest_hour = "The hour (0–23) the daily digest is sent, in your timezone (see Timezone)."
settings_label_digest_minute = "Digest minute"
settings_hint_digest_minute = "The minute (0–59) of the digest hour."
settings_label_digest_items = "Digest length"
settings_hint_digest_items = "How many posts each daily digest lists."
settings_label_digest_line_chars = "Digest line length"
settings_hint_line_chars = "The longest a digest line may be, in characters (at least 20)."
settings_label_confidence = "Sorting confidence"
settings_hint_confidence = "How sure the classifier must be to sort a post (0–1). Good posts left unsorted → lower it; wrong posts in a topic → raise it."
settings_label_realtime_strength = "Real-time strength"
settings_hint_realtime_strength = "How strong a post must be to go out immediately. Too much in real time → raise it; stories that mattered waited for the digest → lower it."
settings_label_duplicate_similarity = "Duplicate similarity"
settings_hint_duplicate_similarity = "How alike two posts must be to count as the same story (0–1). The same story posted twice → lower it; different stories merged → raise it."
settings_label_hold_minutes = "Hold time"
settings_hint_hold_minutes = "Minutes a sorted post waits for other chats to carry it before it goes to the digest. Applies at once: a preview of past posts would show the same numbers, since a post carried by other chats later is still sent before its digest."
settings_label_min_chars = "Group minimum length"
settings_hint_min_chars = "Group conversations shorter than this many characters are counted but never sorted; a forward from a channel needs a quarter of it, a shared link a few words."
settings_label_review_hour = "Review hour"
settings_hint_review_hour = "The hour (0–23) of the weekly review, in your timezone (see Timezone)."
settings_label_leaves_per_day = "Leaves per day"
settings_hint_leaves_per_day = "At most this many approved leaves are carried out per day."
settings_label_leave_interval = "Minutes between leaves"
settings_hint_leave_interval = "At least this many minutes pass between two approved leaves."
settings_label_style = "Posting style"
settings_label_weekday = "Review day"
settings_label_strictness = "Topic strictness"
settings_label_sources = "Trusted sources"

